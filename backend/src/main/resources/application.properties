spring.application.name=KNIT-AND-KEEP

# ============================================================
# Semua nilai di bawah bisa diganti lewat variabel lingkungan.
# Bentuknya ${NAMA_VARIABEL:nilai bawaan}, jadi di komputer sendiri
# tidak perlu menyetel apa pun, sedangkan di server cukup mengisi
# variabelnya tanpa mengubah berkas ini.
# ============================================================

# ================= Database =================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knit-and-keep}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Di server sebaiknya diisi "validate" dan perubahan skema dijalankan terpisah,
# supaya kesalahan pemetaan tidak sampai mengubah tabel berisi data nyata.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
logging.level.org.hibernate.SQL=WARN

# ================= Respons galat =================
# Pesan galat tetap dikirim ke frontend, tetapi jejak tumpukan tidak.
# Devtools menyalakannya secara bawaan, dan itu membocorkan isi kode ke browser.
server.error.include-stacktrace=never
server.error.include-message=always

server.port=${PORT:8080}

# ================= Alamat frontend yang diizinkan =================
# Pisahkan dengan koma bila lebih dari satu.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ================= Berkas unggahan =================
# Foto bukti komplain disimpan di sini, bukan di dalam database.
# Di server, arahkan ke folder yang isinya bertahan setelah aplikasi dimulai ulang.
app.unggahan.folder=${UNGGAHAN_FOLDER:./unggahan}
app.unggahan.url-publik=${UNGGAHAN_URL:/unggahan}

# ================= Token masuk =================
# WAJIB diganti sebelum dipublikasikan. Minimal 32 karakter acak.
# Mengganti nilainya otomatis mengeluarkan semua sesi yang sedang berjalan.
app.jwt.secret=${JWT_SECRET:knit-and-keep-kunci-pengembangan-jangan-dipakai-di-server-2026}
app.jwt.masa-berlaku-jam=${JWT_JAM:12}

# ================= Midtrans =================
# Saat toko live: isi MIDTRANS_PRODUCTION=true beserta pasangan key produksi.
midtrans.is-production=${MIDTRANS_PRODUCTION:false}
midtrans.server.key=${MIDTRANS_SERVER_KEY:ISI-MIDTRANS-SERVER-KEY}
midtrans.client.key=${MIDTRANS_CLIENT_KEY:ISI-MIDTRANS-CLIENT-KEY}

# Berapa lama pesanan menunggu pembayaran sebelum kedaluwarsa (menit).
midtrans.expiry-minutes=${MIDTRANS_EXPIRY_MINUTES:1440}

# Backend menanyakan status pembayaran langsung ke Midtrans secara berkala.
# Ini yang membuat pembayaran tetap terkonfirmasi meski webhook tidak bisa
# menjangkau localhost. Tetap berguna di server sebagai jaring pengaman
# kalau notifikasi Midtrans gagal terkirim.
midtrans.polling.enabled=${MIDTRANS_POLLING:true}
midtrans.polling.interval-ms=${MIDTRANS_POLLING_MS:60000}

# ================= RajaOngkir (Komerce) =================
rajaongkir.api.key=${RAJAONGKIR_KEY:ISI-RAJAONGKIR-KEY}
rajaongkir.api.baseurl=${RAJAONGKIR_URL:https://rajaongkir.komerce.id/api/v1}

# ================= Alamat toko (titik asal pengiriman) =================
# ID diambil dari GET /api/shipping/cari-tujuan?q=namakota
toko.nama=${TOKO_NAMA:Knit & Keep}
toko.origin.id=${TOKO_ORIGIN_ID:4816}
toko.origin.label=${TOKO_ORIGIN_LABEL:Bandung, Jawa Barat}
# Kurir yang ditawarkan ke pelanggan, dipisah titik dua.
toko.kurir=${TOKO_KURIR:jne:sicepat:jnt:pos:tiki}
# Berat minimum satu paket dalam gram, dipakai kalau produk belum diisi beratnya.
toko.berat-minimum=${TOKO_BERAT_MINIMUM:1000}

# Tarif cadangan, dipakai HANYA saat RajaOngkir tidak bisa dihubungi atau
# kuotanya habis. Tanpa ini, gangguan di layanan ongkir membuat toko berhenti
# menerima pesanan sama sekali — kerugian yang jauh lebih besar daripada
# selisih ongkir. Bentuknya: kode:nama:tarif:estimasi, dipisah koma.
toko.ongkir-cadangan=${TOKO_ONGKIR_CADANGAN:HEMAT:Pengiriman Hemat:9000:4-7 hari,REGULER:Pengiriman Reguler:15000:2-4 hari,EKSPRES:Pengiriman Ekspres:28000:1-2 hari}

# ================= Zona waktu =================
# Laporan harian dan bulanan memakai tanggal server. Tanpa ini, server yang
# berjalan di UTC akan memotong "hari ini" pada pukul 07.00 waktu Indonesia.
app.zona-waktu=${TZ:Asia/Jakarta}

# ================= Data contoh =================
# Produk dan akun pelanggan contoh hanya berguna saat aplikasi baru pertama
# kali dicoba. Begitu toko diisi barang sungguhan, data contoh justru
# mengotori katalog dan laporan — dan akan terisi ulang sendiri setiap kali
# tabelnya dikosongkan. Setel true kalau ingin melihat isian contohnya lagi.
app.data-contoh=${DATA_CONTOH:false}

# ================= Akun pengelola pertama =================
# Hanya dipakai di mode produksi, dan hanya saat database masih benar-benar
# kosong. Kalau sandinya dibiarkan kosong, aplikasi membuat sandi acak dan
# mencetaknya sekali di log — jadi tidak ada sandi tebakan seperti "admin123"
# yang ikut terbawa ke server.
app.admin-awal.username=${ADMIN_AWAL_USERNAME:admin}
app.admin-awal.email=${ADMIN_AWAL_EMAIL:admin@knitandkeep.com}
app.admin-awal.password=${ADMIN_AWAL_PASSWORD:}

# ================= Pemeliharaan data =================
# Pemberitahuan yang sudah dibaca dan lebih tua dari sekian hari dibersihkan,
# supaya tabelnya tidak tumbuh tanpa batas selama bertahun-tahun.
app.pemeliharaan.simpan-notifikasi-hari=${SIMPAN_NOTIFIKASI_HARI:90}
